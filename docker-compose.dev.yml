# Services de développement : seulement la base et Valkey. Les apps tournent avec `pnpm dev`.
name: phenix-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql # chemin changé en Postgres 18
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:9
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 10

  # Stockage S3 des transcripts, preuves et images. Image sans shell : les commandes passent par /garage
  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      # Jeton de l'API d'administration : le bot y lit le volume des buckets (page Métriques)
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - '127.0.0.1:3900:3900' # API S3, seulement sur ta machine
      - '127.0.0.1:3903:3903' # API d'administration, seulement sur ta machine
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

volumes:
  pgdata:
  redisdata:
  garagemeta:
  garagedata:
